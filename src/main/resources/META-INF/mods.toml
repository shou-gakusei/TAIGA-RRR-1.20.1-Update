modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="mantle"
    mandatory=true
    versionRange="[1.11.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tconstruct"
    mandatory=true
    versionRange="[3.10.0,)"
    ordering="AFTER"
    side="BOTH"

# 更多挖掘等级：材料 stats 的 mining_tier 依赖它注册的等级 5/6/7，因此为必需依赖
[[dependencies.${mod_id}]]
    modId="moreharvestinglevel"
    mandatory=true
    versionRange="[0.0.1,)"
    ordering="NONE"
    side="BOTH"

