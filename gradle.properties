# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
# ForgeGradle 的 MCP 内部编译任务需要 JDK 17 工具链；本机 JDK17 已从 TUNA 镜像手动安装
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=D:\\other\\pcl\\jdk-17,D:\\other\\pcl\\jdk-21

# 直连即可（实测 Moofang/Forge maven 直连 ~6MB/s）；代理会成瓶颈且可能掉线，故不启用
# 下载重试
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500

# 环境
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.8
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# 依赖版本
mantle_version=1.20.1-1.11.79
tconstruct_version=1.20.1-3.10.2.92

# Mod 信息
mod_id=taiga
mod_name=TAIGA
mod_license=MIT
mod_version=1.20.1-1.3.3
mod_group_id=com.whfwtf
mod_authors=Zkaface, Chefe, Team Threshold, whfwtf
mod_description=TAIGA 1.20.1 port: 37 new Tinkers' Construct materials, their ores, blocks, items, molten fluids, traits and alloys.
